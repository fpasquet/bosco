# Refuse d’installer avec une autre version de Node que celle de `.nvmrc` (engines de package.json)
engineStrict: true
packages:
  - apps/*
  - packages/*
  - e2e
  - tools/*
minimumReleaseAgeExclude:
  - '@mikro-orm/core@7.2.8'
  - '@mikro-orm/migrations@7.2.8'
  - '@mikro-orm/sql@7.2.8'
  - '@mikro-orm/sqlite@7.2.8'
  - '@tanstack/query-core@5.107.1'
  - '@tanstack/react-query@5.107.1'
  - commander@15.1.0
  - '@ai-sdk/gateway@4.0.149'
  - '@ai-sdk/harness@1.0.187'
  - '@ai-sdk/provider-utils@5.0.82'
  - '@ai-sdk/provider@4.0.39'
  - ai@7.0.176

# Paquets dont le script d'installation est permis : moteur SQLite (MikroORM) et esbuild (Storybook, Vite)
allowBuilds:
  better-sqlite3: true
  # Application du poste : le script d'installation télécharge le binaire d'Electron
  electron: true
  # Installateur Windows d'electron-builder : sans objet, le paquet du poste est un .deb
  electron-winstaller: false
  esbuild: true
  # Site de documentation : wrangler (déploiement sur Cloudflare Pages) télécharge le moteur workerd
  workerd: true
patchedDependencies:
  react-native-webview@14.0.1: patches/react-native-webview@14.0.1.patch
