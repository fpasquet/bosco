packages:
  - apps/*
  - packages/*
  - e2e
minimumReleaseAgeExclude:
  - '@mikro-orm/core@7.2.8'
  - '@mikro-orm/migrations@7.2.8'
  - '@mikro-orm/sql@7.2.8'
  - '@mikro-orm/sqlite@7.2.8'
  - '@tanstack/query-core@5.107.1'
  - '@tanstack/react-query@5.107.1'
  - commander@15.1.0

# Paquets dont le script d'installation est permis : moteur SQLite (MikroORM) et esbuild (Storybook, Vite)
allowBuilds:
  better-sqlite3: true
  esbuild: true
